version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: antartur_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: antartur
      POSTGRES_PASSWORD: antartur_dev_password
      POSTGRES_DB: antartur
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antartur"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antartur_network

  # Next.js App (Development)
  app:
    image: node:20-slim
    container_name: antartur_app
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://antartur:antartur_dev_password@postgres:5432/antartur
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      # Payway Sandbox Credentials
      - PAYWAY_API_KEY=1WLn54DegiBOPpM0K40b5bTMuFqxv7ld
      - PAYWAY_MERCHANT_ID=93003147
      - PAYWAY_ENVIRONMENT=sandbox
      - PAYWAY_SITE_ID=93003147
      - PAYWAY_TEMPLATE_ID=42737
      # Payway Public Key for Frontend SDK
      - NEXT_PUBLIC_PAYWAY_PUBLIC_KEY=H6Myip546bxogX2oqHxLSYZzCrxwS9ff
      - NEXT_PUBLIC_PAYWAY_ENVIRONMENT=sandbox
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - antartur_network
    command: sh -c "apt-get update && apt-get install -y openssl && npm install --legacy-peer-deps && npx prisma generate && npm run dev"

  # pgAdmin (Optional - Database UI for development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: antartur_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@antartur.tur.ar
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - antartur_network

networks:
  antartur_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:

