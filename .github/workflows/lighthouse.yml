name: Lighthouse CI

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.cursorrules'
      - 'README.md'

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Start Next.js server
        run: |
          npm start > /tmp/nextjs-server.log 2>&1 &
          echo $! > /tmp/nextjs-server.pid
        env:
          NODE_ENV: production
          PORT: 3000

      - name: Wait for server to be ready
        run: |
          echo "Waiting for Next.js server to start..."
          timeout=120
          counter=0
          until curl -f http://localhost:3000 > /dev/null 2>&1 || [ $counter -eq $timeout ]; do
            sleep 2
            counter=$((counter + 2))
            echo "Waiting... ($counter/$timeout seconds)"
          done
          if [ $counter -eq $timeout ]; then
            echo "Server failed to start"
            echo "Server logs:"
            cat /tmp/nextjs-server.log
            exit 1
          fi
          echo "Server is ready!"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000
            http://localhost:3000/verano
            http://localhost:3000/invierno
            http://localhost:3000/antartida
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.lighthouserc.json

      - name: Comment PR with Lighthouse results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let comment = '## 🚀 Lighthouse Report\n\n';
            comment += 'Lighthouse audit completado para este PR.\n\n';
            
            // Intentar leer los resultados si existen
            const resultsPath = path.join('.lighthouseci', 'results.json');
            const linksPath = path.join('.lighthouseci', 'links.json');
            
            if (fs.existsSync(resultsPath)) {
              try {
                const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
                
                comment += '### 📊 Resultados\n\n';
                comment += '| Página | Performance | Accessibility | Best Practices | SEO |\n';
                comment += '|--------|------------|--------------|----------------|-----|\n';
                
                if (Array.isArray(results)) {
                  results.forEach((result) => {
                    const url = result.url || 'Unknown';
                    const displayUrl = url.replace('http://localhost:3000', '') || '/';
                    const scores = result.scores || {};
                    const perf = Math.round((scores.performance || 0) * 100);
                    const a11y = Math.round((scores.accessibility || 0) * 100);
                    const best = Math.round((scores['best-practices'] || 0) * 100);
                    const seo = Math.round((scores.seo || 0) * 100);
                    
                    comment += `| ${displayUrl} | ${perf} | ${a11y} | ${best} | ${seo} |\n`;
                  });
                }
                comment += '\n';
              } catch (error) {
                comment += '⚠️ Error al leer los resultados de Lighthouse.\n\n';
              }
            }
            
            if (fs.existsSync(linksPath)) {
              try {
                const links = JSON.parse(fs.readFileSync(linksPath, 'utf8'));
                if (Array.isArray(links) && links.length > 0) {
                  comment += '### 🔗 Reportes Detallados\n\n';
                  links.forEach((link, index) => {
                    comment += `- [Reporte ${index + 1}](${link})\n`;
                  });
                  comment += '\n';
                }
              } catch (error) {
                // Ignorar error si no se puede leer links
              }
            }
            
            comment += '📦 Los reportes completos están disponibles en los artifacts de este workflow.\n\n';
            comment += '---\n';
            comment += '*Este reporte se genera automáticamente en cada PR hacia main.*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Stop Next.js server
        if: always()
        run: |
          if [ -f /tmp/nextjs-server.pid ]; then
            kill $(cat /tmp/nextjs-server.pid) || true
          fi
